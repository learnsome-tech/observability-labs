# Full-Stack Observability: Metrics, Tracing & Logging — lesson m02l05 — Prometheus Scraping And The Pull Model
# https://learnsome.tech/courses/observability-course/watch?lesson=m02l05
# © LearnSome.tech
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/alerts.yml
  - /etc/prometheus/rules/slo.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: checkout
    metrics_path: /metrics
    static_configs:
      - targets: ["service:8000"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
